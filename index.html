<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f5f9">
<title>Conferidor de Expedição - Grupo Duom</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; }
  :root { color-scheme: light; }
  body { margin:0; padding:8px 10px max(10px,env(safe-area-inset-bottom)); background:#f3f5f9; color:#263b69; font-family:Arial,Helvetica,sans-serif; }
  .app { width:100%; max-width:520px; margin:0 auto; }
  .oculto { display:none !important; }
  .acesso { display:flex; align-items:center; gap:10px; background:white; padding:9px 11px; border-radius:11px; margin-bottom:8px; min-height:52px; }
  .acesso-conteudo { flex:1; min-width:0; }
  .acesso-titulo { font-size:12px; font-weight:700; margin-bottom:2px; }
  #usuario { font-size:11px; color:#667085; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #googleButton { margin-top:7px; }
  .acesso.conectado { min-height:42px; padding:6px 10px; }
  .btn-sair { width:auto; flex:none; border:0; padding:8px 12px; margin:0; font-size:12px; border-radius:8px; color:#344054; background:#e9edf3; font-weight:700; cursor:pointer; }
  .painel { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px; margin-bottom:8px; }
  .contador { background:white; border-radius:10px; text-align:center; padding:7px 5px 6px; min-width:0; }
  .contador .rotulo { font-size:11px; color:#667085; font-weight:700; }
  .numero { font-size:27px; line-height:1.1; font-weight:800; margin-top:2px; font-variant-numeric:tabular-nums; }
  .verde { color:#16803c; } .vermelho { color:#c62828; } .azul { color:#27528b; } .roxo { color:#7546a2; }
  .camera-cartao { background:white; border-radius:11px; padding:8px; }
  .camera-titulo { display:flex; justify-content:space-between; align-items:center; gap:8px; margin:0 0 6px; font-size:12px; font-weight:700; }
  .camera-titulo span:last-child { font-size:11px; font-weight:400; color:#667085; }
  #reader { width:100%; background:#17212f; border-radius:9px; overflow:hidden; min-height:180px; max-height: min(37dvh, 310px); }
  #reader video { display:block !important; max-height:min(37dvh,310px) !important; width:100% !important; object-fit:contain !important; }
  #reader img { max-height: min(37dvh,310px); object-fit:contain; }
  #resultado { display:none; padding:9px 10px; border-radius:9px; text-align:center; margin-top:7px; overflow-wrap:anywhere; font-size:12px; }
  #resultado strong { display:block; font-size:21px; margin-bottom:2px; }
  .sucesso { background:#d9f5e3; color:#146c36; }
  .duplicado { background:#ffe0e0; color:#b71c1c; }
  .aviso { background:#fff0ca; color:#805500; }
  .extras { display:flex; gap:8px; margin-top:7px; align-items:center; }
  .extras button { flex:1; border:1px solid #cbd5e1; background:#edf2fa; color:#263b69; border-radius:9px; padding:9px 6px; font-size:12px; font-weight:700; cursor:pointer; }
  .extras button.acesa { background:#fff1c2; border-color:#e8b63e; }
  .acoes { display:flex; gap:8px; margin-top:8px; }
  .acoes button { flex:1; min-width:0; border:0; border-radius:9px; padding:11px 7px; background:#263b69; color:white; font-size:13px; font-weight:700; cursor:pointer; }
  .acoes button:last-child { background:#52627c; }
  button:disabled { opacity:.45; cursor:default; }
  #status { color:#667085; text-align:center; font-size:11px; margin:7px 0 0; overflow-wrap:anywhere; }
  @media (max-height:760px) { #reader, #reader video, #reader img { max-height:min(32dvh,250px) !important; } .numero { font-size:24px; } .contador { padding:5px; } }
  @media (min-width:700px) { body { padding:16px; } #reader, #reader video, #reader img { max-height:350px !important; } }
</style>
</head>
<body>
<main class="app">
  <section id="acesso" class="acesso" aria-label="Acesso do operador">
    <div class="acesso-conteudo">
      <div class="acesso-titulo">Operador</div>
      <div id="usuario">Faça login com a conta autorizada.</div>
      <div id="googleButton"></div>
    </div>
    <button id="btnSair" class="btn-sair oculto" onclick="sair()">Sair</button>
  </section>
  <section class="painel" aria-label="Indicadores de hoje">
    <div class="contador"><div class="rotulo">Liberados hoje</div><div id="liberados" class="numero verde">0</div></div>
    <div class="contador"><div class="rotulo">Duplicidades hoje</div><div id="duplicados" class="numero vermelho">0</div></div>
    <div class="contador"><div class="rotulo">Agência</div><div id="agencia" class="numero azul">0</div></div>
    <div class="contador"><div class="rotulo">Flex</div><div id="flex" class="numero roxo">0</div></div>
  </section>
  <section class="camera-cartao" aria-label="Leitor de etiquetas">
    <div class="camera-titulo"><span>Leitor de etiquetas</span><span>QR Code</span></div>
    <div id="reader"></div>
    <div id="resultado" role="status" aria-live="polite"></div>
  </section>
  <div class="extras">
    <button id="btnLanterna" onclick="alternarLanterna()" disabled>🔦 LANTERNA</button>
    <button id="btnSom" onclick="alternarSom()">🔊 SOM LIGADO</button>
  </div>
  <div class="acoes">
    <button id="btnIniciar" onclick="iniciarCamera()" disabled>INICIAR CÂMERA</button>
    <button id="btnParar" onclick="pararCamera()" disabled>PARAR CÂMERA</button>
  </div>
  <div id="status">Aguardando login Google.</div>
</main>
<script>
const CLIENT_ID =
      "772405314986-gn3tjfsqs1a7e1ua5539nqnes2to5m0o.apps.googleusercontent.com";

    const API_URL =
      "https://qtheeurtuxtcliybatih.supabase.co/functions/v1/conferir-envio";

    const PAUSA_APOS_LEITURA = 800;
    const INTERVALO_MESMO_CODIGO = 4000;

    let tokenGoogle = null;
    let leitor = null;
    let iniciando = false;
    let processando = false;
    let cameraAtiva = false;
    let ultimoCodigo = "";
    let ultimoMomento = 0;
    let temporizador = null;
    let geracaoCamera = 0;
    let audioContexto = null;
    let somAtivo = true;
    let lanternaAtiva = false;
    let trilhaCamera = null;

    function prepararAudio() {
      try {
        const AudioCtor = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtor) return;
        if (!audioContexto) audioContexto = new AudioCtor();
        if (audioContexto.state === "suspended") audioContexto.resume().catch(() => {});
      } catch (e) { console.warn("Áudio indisponível", e); }
    }

    function emitirTom(frequencia, duracao, atraso = 0, volume = 0.12, forma = "sine") {
      if (!somAtivo || !audioContexto || audioContexto.state !== "running") return;
      const inicio = audioContexto.currentTime + atraso;
      const oscilador = audioContexto.createOscillator();
      const ganho = audioContexto.createGain();
      oscilador.type = forma;
      oscilador.frequency.value = frequencia;
      ganho.gain.setValueAtTime(0.0001, inicio);
      ganho.gain.exponentialRampToValueAtTime(volume, inicio + 0.015);
      ganho.gain.exponentialRampToValueAtTime(0.0001, inicio + duracao);
      oscilador.connect(ganho);
      ganho.connect(audioContexto.destination);
      oscilador.start(inicio);
      oscilador.stop(inicio + duracao + 0.02);
    }

    function tocarResultado(status) {
      try {
        if (status === "LIBERADO") emitirTom(880, 0.13);
        if (status === "DUPLICADO") {
          // Alarme destacado: tres pulsos com timbre mais incisivo.
          emitirTom(620, 0.23, 0.00, 0.22, "square");
          emitirTom(480, 0.23, 0.30, 0.22, "square");
          emitirTom(620, 0.34, 0.60, 0.22, "square");
        }
      } catch (e) { console.warn("Não foi possível tocar o aviso", e); }
    }

    function alternarSom() {
      prepararAudio();
      somAtivo = !somAtivo;
      el("btnSom").textContent = somAtivo ? "🔊 SOM LIGADO" : "🔇 SOM DESLIGADO";
      if (somAtivo) emitirTom(880, 0.10);
    }

    function obterTrilhaCamera() {
      const video = el("reader").querySelector("video");
      return video?.srcObject?.getVideoTracks?.()[0] || null;
    }

    function atualizarBotaoLanterna(disponivel) {
      const botao = el("btnLanterna");
      botao.disabled = !disponivel;
      botao.classList.toggle("acesa", lanternaAtiva);
      botao.textContent = lanternaAtiva ? "🔦 DESLIGAR LANTERNA" : "🔦 LIGAR LANTERNA";
      botao.title = disponivel ? "Controlar o flash da câmera" : "Lanterna não disponível nesta câmera/navegador";
    }

    async function alternarLanterna() {
      const trilha = obterTrilhaCamera();
      if (!cameraAtiva || !trilha) return;
      try {
        const proximo = !lanternaAtiva;
        await trilha.applyConstraints({ advanced: [{ torch: proximo }] });
        lanternaAtiva = proximo;
        atualizarBotaoLanterna(true);
      } catch (erro) {
        console.warn("Lanterna indisponível", erro);
        el("status").textContent = "Não foi possível controlar a lanterna neste navegador.";
        lanternaAtiva = false;
        atualizarBotaoLanterna(false);
      }
    }

    function verificarLanterna() {
      const trilha = obterTrilhaCamera();
      trilhaCamera = trilha;
      let disponivel = false;
      try { disponivel = trilha?.getCapabilities?.().torch === true; } catch (e) {}
      lanternaAtiva = false;
      atualizarBotaoLanterna(disponivel);
    }

    const el = id => document.getElementById(id);

    function mensagemErro(erro) {
      return erro?.message || String(erro);
    }

    function mostrarResultado(tipo, titulo, detalhe) {
      const caixa = el("resultado");
      caixa.style.display = "block";
      caixa.className = tipo;
      caixa.replaceChildren();

      const forte = document.createElement("strong");
      forte.textContent = titulo;

      const texto = document.createElement("div");
      texto.textContent = detalhe;

      caixa.append(forte, texto);
    }

    function atualizarTotais(totais) {
      if (!totais) return;

      el("liberados").textContent =
        totais.liberadosHoje ?? 0;

      el("duplicados").textContent =
        totais.duplicadosHoje ?? 0;
      el("agencia").textContent = totais.agenciaHoje ?? 0;
      el("flex").textContent = totais.flexHoje ?? 0;
    }

    function loginGoogle(resposta) {
      if (!resposta?.credential) return;

      tokenGoogle = resposta.credential;

      el("usuario").textContent = "Operador conectado";
      el("googleButton").classList.add("oculto");
      el("acesso").classList.add("conectado");

      el("btnIniciar").disabled = false;
      el("btnSair").classList.remove("oculto");

      el("status").textContent =
        "Login realizado. Inicie a câmera.";
    }

    function iniciarLogin() {
      if (!window.google?.accounts?.id) {
        el("status").textContent =
          "Não foi possível carregar o login Google.";
        return;
      }

      google.accounts.id.initialize({
        client_id: CLIENT_ID,
        callback: loginGoogle,
        auto_select: false
      });

      google.accounts.id.renderButton(
        el("googleButton"),
        {
          theme: "outline",
          size: "large",
          text: "signin_with",
          width: 260
        }
      );
    }

    async function codigoLido(codigo) {
      if (
        !tokenGoogle ||
        !cameraAtiva ||
        processando
      ) return;

      const agora = Date.now();

      if (
        codigo === ultimoCodigo &&
        agora - ultimoMomento < INTERVALO_MESMO_CODIGO
      ) return;

      processando = true;
      ultimoCodigo = codigo;
      ultimoMomento = agora;

      const geracaoAtual = geracaoCamera;

      // Pausa o processamento, mantendo a câmera aberta.
      try {
        leitor.pause(true);
      } catch (e) {}

      mostrarResultado(
        "aviso",
        "CONFERINDO...",
        "Consultando o Supabase."
      );

      el("status").textContent =
        "Processando etiqueta...";

      try {
        const resposta = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + tokenGoogle
          },
          body: JSON.stringify({ id: codigo })
        });

        const dados = await resposta.json();

        if (!resposta.ok) {
          throw new Error(
            dados.erro || "Erro na conferência."
          );
        }

        const tipoLegivel = dados.tipoEnvio === "FLEX"
          ? "Flex" : dados.tipoEnvio === "AGENCIA" ? "Agência" : "";
        const sufixoTipo = tipoLegivel ? " · " + tipoLegivel : "";

        if (dados.status === "LIBERADO") {
          mostrarResultado(
            "sucesso",
            "LIBERADO",
            "Envio: " + dados.id + sufixoTipo
          );
        } else if (dados.status === "DUPLICADO") {
          mostrarResultado(
            "duplicado",
            "DUPLICADO",
            "Envio já conferido: " + dados.id + sufixoTipo
          );
        } else {
          throw new Error(
            "Resposta inesperada do servidor."
          );
        }

        atualizarTotais(dados.totais);
        tocarResultado(dados.status);
        if (dados.status === "DUPLICADO") {
          // Vibra apenas quando o servidor confirma a duplicidade.
          // O recurso depende do suporte e das configuracoes do Android.
          try {
            if (typeof navigator.vibrate === "function") {
              navigator.vibrate([200, 100, 200, 100, 250]);
            }
          } catch (e) {
            console.warn("Vibracao indisponivel", e);
          }
        }

        el("status").textContent =
          "Conferência concluída. Próxima etiqueta automaticamente.";

      } catch (erro) {
        mostrarResultado(
          "aviso",
          "NÃO CONFERIDO",
          mensagemErro(erro)
        );

        el("status").textContent =
          "Falha na conferência. Verifique o envio antes de continuar.";

      } finally {
        processando = false;

        // Retoma automaticamente apenas se a
        // mesma câmera continuar ativa.
        if (
          cameraAtiva &&
          leitor &&
          geracaoAtual === geracaoCamera
        ) {
          temporizador = setTimeout(() => {
            temporizador = null;

            if (!cameraAtiva || !leitor) return;

            try {
              leitor.resume();
              el("status").textContent =
                "Câmera ativa. Aponte para a próxima etiqueta.";
            } catch (e) {
              console.error(e);
            }
          }, PAUSA_APOS_LEITURA);
        }
      }
    }

    async function iniciarCamera() {
      if (
        leitor ||
        iniciando ||
        !tokenGoogle
      ) return;

      prepararAudio(); // Acionado pelo toque em INICIAR CÂMERA
      iniciando = true;
      el("btnIniciar").disabled = true;

      try {
        if (typeof Html5Qrcode === "undefined") {
          throw new Error(
            "Biblioteca QR Code não carregada."
          );
        }

        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error(
            "Câmera indisponível neste navegador."
          );
        }

        el("status").textContent =
          "Solicitando acesso à câmera...";

        leitor = new Html5Qrcode("reader");

        await leitor.start(
          { facingMode: "environment" },
          {
            fps: 10,
            qrbox: function(w, h) {
              const tamanho = Math.max(
                100,
                Math.min(
                  240,
                  Math.floor(Math.min(w, h) * 0.75)
                )
              );

              return {
                width: tamanho,
                height: tamanho
              };
            }
          },
          codigoLido,
          function() {}
        );

        geracaoCamera++;
        cameraAtiva = true;
        ultimoCodigo = "";
        ultimoMomento = 0;

        verificarLanterna();
        el("btnParar").disabled = false;
        el("status").textContent =
          "Câmera ativa. Aponte para o QR Code.";

      } catch (erro) {
        el("status").textContent =
          "Erro da câmera: " + mensagemErro(erro);

        if (leitor) {
          try { await leitor.clear(); } catch (e) {}
        }

        leitor = null;
        el("btnIniciar").disabled = false;

      } finally {
        iniciando = false;
      }
    }

    async function pararCamera() {
      cameraAtiva = false;
      geracaoCamera++;
      lanternaAtiva = false;
      trilhaCamera = null;
      atualizarBotaoLanterna(false);

      if (temporizador) {
        clearTimeout(temporizador);
        temporizador = null;
      }

      const atual = leitor;
      leitor = null;

      if (atual) {
        try {
          await atual.stop();
          await atual.clear();
        } catch (erro) {
          console.error(erro);
        }
      }

      el("btnIniciar").disabled = !tokenGoogle;
      el("btnParar").disabled = true;
      el("status").textContent = "Câmera parada.";
    }

    async function sair() {
      if (processando) return;

      await pararCamera();

      tokenGoogle = null;
      google.accounts.id.disableAutoSelect();

      el("usuario").textContent = "Faça login com a conta autorizada.";
      el("googleButton").classList.remove("oculto");
      el("acesso").classList.remove("conectado");

      el("btnIniciar").disabled = true;
      el("btnSair").classList.add("oculto");
      el("status").textContent = "Sessão encerrada.";
    }

    window.addEventListener("load", iniciarLogin);
  </script>
</body>
</html>
