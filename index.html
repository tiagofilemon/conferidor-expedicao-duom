
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Conferidor de Expedição - Grupo Duom</title>

  <script src="https://accounts.google.com/gsi/client"
          async defer></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #f3f5f9;
      color: #263b69;
      margin: 0;
      padding: 16px;
    }

    h2 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitulo {
      text-align: center;
      color: #666;
      margin-bottom: 18px;
    }

    .cartao {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .login {
      text-align: center;
    }

    #googleButton {
      display: flex;
      justify-content: center;
      margin: 14px 0;
    }

    .painel {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }

    .contador {
      flex: 1;
      background: white;
      padding: 16px 8px;
      border-radius: 12px;
      text-align: center;
    }

    .numero {
      font-size: 38px;
      font-weight: bold;
      margin-top: 8px;
    }

    .verde { color: #16803c; }
    .vermelho { color: #c62828; }

    #resultado {
      display: none;
      padding: 22px 12px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 14px;
      overflow-wrap: anywhere;
    }

    #resultado strong {
      display: block;
      font-size: 29px;
      margin-bottom: 8px;
    }

    .sucesso {
      background: #d9f5e3;
      color: #146c36;
    }

    .duplicado {
      background: #ffe0e0;
      color: #b71c1c;
    }

    .aviso {
      background: #fff0ca;
      color: #805500;
    }

    #reader {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 10px;
      background: #263b69;
      color: white;
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 10px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #btnProximo {
      background: #16803c;
    }

    .info {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-top: 12px;
      overflow-wrap: anywhere;
    }

    .oculto { display: none; }
  </style>
</head>

<body>

  <h2>GRUPO DUOM</h2>
  <div class="subtitulo">
    Conferência de Expedição
  </div>

  <div class="cartao login">
    <strong>Acesso do operador</strong>
    <div id="googleButton"></div>
    <div id="usuario" class="info">
      Faça login com a conta autorizada.
    </div>
    <button id="btnSair"
            class="oculto"
            onclick="sair()">
      SAIR
    </button>
  </div>

  <div class="painel">
    <div class="contador">
      <div>Liberados hoje</div>
      <div id="liberados" class="numero verde">0</div>
    </div>

    <div class="contador">
      <div>Duplicidades hoje</div>
      <div id="duplicados" class="numero vermelho">0</div>
    </div>
  </div>

  <div id="resultado" role="status"
       aria-live="polite"></div>

  <div id="reader"></div>

  <button id="btnIniciar"
          onclick="iniciarCamera()" disabled>
    INICIAR CÂMERA
  </button>

  <button id="btnProximo"
          class="oculto"
          onclick="proximaLeitura()">
    CONFERIR PRÓXIMA ETIQUETA
  </button>

  <button id="btnParar"
          onclick="pararCamera()" disabled>
    PARAR CÂMERA
  </button>

  <div id="status" class="info">
    Aguardando login Google.
  </div>

  <script>
    const CLIENT_ID =
      "772405314986-gn3tjfsqs1a7e1ua5539nqnes2to5m0o.apps.googleusercontent.com";

    const API_URL =
      "https://qtheeurtuxtcliybatih.supabase.co/functions/v1/conferir-envio";

    const EMAIL_AUTORIZADO =
      "tiago.filemon@gmail.com";

    let tokenGoogle = null;
    let leitor = null;
    let iniciando = false;
    let processando = false;
    let aguardandoProximo = false;

    const el = id => document.getElementById(id);

    function mensagemErro(erro) {
      return erro?.message || String(erro);
    }

    function mostrarResultado(tipo, titulo, detalhe) {
      const caixa = el("resultado");
      caixa.style.display = "block";
      caixa.className = tipo;

      caixa.replaceChildren();

      const forte = document.createElement("strong");
      forte.textContent = titulo;

      const texto = document.createElement("div");
      texto.textContent = detalhe;

      caixa.append(forte, texto);
    }

    function atualizarTotais(totais) {
      if (!totais) return;

      el("liberados").textContent =
        totais.liberadosHoje ?? 0;

      el("duplicados").textContent =
        totais.duplicadosHoje ?? 0;
    }

    function loginGoogle(resposta) {
      if (!resposta?.credential) {
        el("status").textContent =
          "Não foi possível obter o login Google.";
        return;
      }

      tokenGoogle = resposta.credential;

      // O e-mail exibido aqui é apenas informativo.
      // A autorização real ocorre na Edge Function.
      el("usuario").textContent =
        "Login Google recebido. Pronto para conferir.";

      el("btnIniciar").disabled = false;
      el("btnSair").classList.remove("oculto");

      el("status").textContent =
        "Login realizado. Inicie a câmera.";
    }

    function iniciarLogin() {
      if (!window.google?.accounts?.id) {
        el("status").textContent =
          "Não foi possível carregar o login Google.";
        return;
      }

      google.accounts.id.initialize({
        client_id: CLIENT_ID,
        callback: loginGoogle,
        auto_select: false
      });

      google.accounts.id.renderButton(
        el("googleButton"),
        {
          theme: "outline",
          size: "large",
          text: "signin_with",
          width: 260
        }
      );
    }

    function sair() {
      if (processando) return;

      tokenGoogle = null;

      google.accounts.id.disableAutoSelect();

      pararCamera();

      el("usuario").textContent =
        "Faça login com a conta autorizada.";

      el("btnIniciar").disabled = true;
      el("btnSair").classList.add("oculto");

      el("status").textContent =
        "Sessão encerrada.";
    }

    async function codigoLido(codigo) {
      if (
        !tokenGoogle ||
        processando ||
        aguardandoProximo
      ) return;

      processando = true;
      aguardandoProximo = true;

      if (leitor) {
        try { leitor.pause(true); } catch (e) {}
      }

      el("btnProximo").classList.add("oculto");

      mostrarResultado(
        "aviso",
        "CONFERINDO...",
        "Consultando o envio no Supabase."
      );

      el("status").textContent =
        "Aguarde a resposta da conferência.";

      try {
        const resposta = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + tokenGoogle
          },
          body: JSON.stringify({
            id: codigo
          })
        });

        const dados = await resposta.json();

        if (!resposta.ok) {
          throw new Error(
            dados.erro || "Erro na conferência."
          );
        }

        if (dados.status === "LIBERADO") {
          mostrarResultado(
            "sucesso",
            "LIBERADO",
            "Envio: " + dados.id
          );
        } else if (dados.status === "DUPLICADO") {
          mostrarResultado(
            "duplicado",
            "DUPLICADO",
            "ATENÇÃO! Envio já conferido: " + dados.id
          );
        } else {
          throw new Error(
            "Resposta inesperada do servidor."
          );
        }

        atualizarTotais(dados.totais);

        el("status").textContent =
          "Retire a etiqueta da câmera e toque em CONFERIR PRÓXIMA ETIQUETA.";

      } catch (erro) {
        mostrarResultado(
          "aviso",
          "NÃO CONFERIDO",
          mensagemErro(erro)
        );

        el("status").textContent =
          "Falha de comunicação ou autenticação. Verifique antes de continuar.";
      } finally {
        processando = false;

        if (leitor) {
          el("btnProximo").classList.remove("oculto");
        }
      }
    }

    async function iniciarCamera() {
      if (
        leitor ||
        iniciando ||
        !tokenGoogle
      ) return;

      iniciando = true;
      el("btnIniciar").disabled = true;

      try {
        if (typeof Html5Qrcode === "undefined") {
          throw new Error(
            "Biblioteca QR Code não carregada."
          );
        }

        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error(
            "Câmera indisponível neste navegador."
          );
        }

        el("status").textContent =
          "Solicitando acesso à câmera...";

        leitor = new Html5Qrcode("reader");

        await leitor.start(
          { facingMode: "environment" },
          {
            fps: 10,
            qrbox: function(w, h) {
              const tamanho = Math.max(
                100,
                Math.min(
                  240,
                  Math.floor(Math.min(w, h) * 0.75)
                )
              );

              return {
                width: tamanho,
                height: tamanho
              };
            }
          },
          codigoLido,
          function() {}
        );

        aguardandoProximo = false;
        el("btnParar").disabled = false;

        el("status").textContent =
          "Câmera ativa. Aponte para o QR Code.";

      } catch (erro) {
        el("status").textContent =
          "Erro da câmera: " + mensagemErro(erro);

        if (leitor) {
          try { await leitor.clear(); } catch (e) {}
        }

        leitor = null;
        el("btnIniciar").disabled = false;

      } finally {
        iniciando = false;
      }
    }

    function proximaLeitura() {
      if (!leitor || processando) return;

      aguardandoProximo = false;

      el("btnProximo").classList.add("oculto");

      el("resultado").style.display = "none";

      try {
        leitor.resume();
      } catch (erro) {
        el("status").textContent =
          "Erro ao retomar câmera: " +
          mensagemErro(erro);
        return;
      }

      el("status").textContent =
        "Aponte para a próxima etiqueta.";
    }

    async function pararCamera() {
      if (!leitor || processando) return;

      const atual = leitor;
      leitor = null;
      aguardandoProximo = true;

      try {
        await atual.stop();
        await atual.clear();
      } catch (erro) {
        console.error(erro);
      }

      el("btnIniciar").disabled = !tokenGoogle;
      el("btnParar").disabled = true;
      el("btnProximo").classList.add("oculto");

      el("status").textContent =
        "Câmera parada.";
    }

    window.addEventListener("load", iniciarLogin);
  </script>

</body>
</html>
